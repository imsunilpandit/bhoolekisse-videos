<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Baloo;font-weight:800;src:url(fonts/fontsource-baloo-bhai-2-5.3.0/files/baloo-bhai-2-gujarati-800-normal.woff2)}
@font-face{font-family:Baloo;font-weight:700;src:url(fonts/fontsource-baloo-bhai-2-5.3.0/files/baloo-bhai-2-gujarati-700-normal.woff2)}
@font-face{font-family:Noto;font-weight:700;src:url(fonts/fontsource-noto-sans-gujarati-5.3.0/files/noto-sans-gujarati-gujarati-700-normal.woff2)}
@font-face{font-family:Noto;font-weight:400;src:url(fonts/fontsource-noto-sans-gujarati-5.3.0/files/noto-sans-gujarati-gujarati-400-normal.woff2)}
html,body{margin:0;background:#000}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,c=document.getElementById('c'),g=c.getContext('2d');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},eo=x=>1-Math.pow(1-cl(x),3),pr=(t,a,d)=>cl((t-a)/d);
let seed=9;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const TM=[0,7.05,10.4,15.65,19.85,23.3,30.15,33.25,37.25,43.55,53.2];

// ---------- text ----------
function T(str,x,y,size,color,t,a,b=99,o={}){const pin=eo(pr(t,a,.45)),pout=1-pr(t,b,.3),al=pin*pout;if(al<=0)return;
  g.save();g.globalAlpha=al;g.translate(x,y+(1-pin)*30);const sc=o.pop?.8+.2*eo(pr(t,a,.5)):1;g.scale(sc,sc);g.rotate(o.rot||0);
  g.font=`${o.w||800} ${size}px ${o.f||'Baloo'}`;g.textAlign='center';g.textBaseline='middle';
  if(o.stroke){g.lineJoin='round';g.lineWidth=o.sw||14;g.strokeStyle=o.stroke;g.strokeText(str,0,0);}
  if(o.shadow){g.shadowColor=o.shadow;g.shadowBlur=o.sb||20;}
  g.fillStyle=color;g.fillText(str,0,0);g.restore();}
function styleTag(name,t,dark){const al=eo(pr(t,.05,.3));g.save();g.globalAlpha=al*.9;g.font='700 34px Noto';const w=g.measureText(name).width+50;
  g.fillStyle=dark?'rgba(255,255,255,.85)':'rgba(0,0,0,.6)';g.beginPath();g.roundRect(540-w/2,1800,w,60,30);g.fill();g.fillStyle=dark?'#222':'#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(name,540,1832);g.restore();}

// ---------- Hanuman (parametric) ----------
function limb(pts,w,col,line,lw){g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(...pts[0]);for(const p of pts.slice(1))g.lineTo(...p);
  if(lw){g.strokeStyle=line;g.lineWidth=w+lw*2;g.stroke();}g.strokeStyle=col;g.lineWidth=w;g.stroke();}
function poly(pts,fill,line,lw){g.beginPath();g.moveTo(...pts[0]);for(const p of pts.slice(1))g.lineTo(...p);g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(lw){g.strokeStyle=line;g.lineWidth=lw;g.lineJoin='round';g.stroke();}}
function hanuman(x,y,s,st,t=0,armA=0){g.save();g.translate(x,y);g.scale(s,s);
  const L=st.line||'#000',lw=st.lw||0,sk=st.skin,cl2=st.cloth,cr=st.crown,ga=st.gada||cr;
  // tail
  g.lineCap='round';g.beginPath();g.moveTo(-50,-300);g.bezierCurveTo(-300,-330,-300,-620,-180,-700);g.quadraticCurveTo(-120,-740,-140,-680);
  if(lw){g.strokeStyle=L;g.lineWidth=30+lw*2;g.stroke();}g.strokeStyle=sk;g.lineWidth=30;g.stroke();
  // legs
  limb([[-80,-160],[-105,-20]],52,sk,L,lw);limb([[80,-160],[105,-20]],52,sk,L,lw);
  poly([[-150,-25],[-70,-25],[-60,8],[-160,8]],sk,L,lw);poly([[150,-25],[70,-25],[60,8],[160,8]],sk,L,lw);
  // dhoti
  const dh=[[-95,-310],[95,-310],[140,-140],[35,-130],[0,-200],[-35,-130],[-140,-140]];poly(dh,cl2,L,lw);
  if(st.dhotiDeco){g.save();poly(dh);g.clip();st.dhotiDeco();g.restore();}
  // torso
  const to=[[-118,-470],[118,-470],[95,-300],[-95,-300]];poly(to,sk,L,lw);
  if(st.chest){g.strokeStyle=st.chest;g.lineWidth=5;g.beginPath();g.moveTo(-70,-420);g.quadraticCurveTo(-35,-390,0,-420);g.quadraticCurveTo(35,-390,70,-420);g.stroke();}
  // sash / janoi + belt
  g.fillStyle=cr;g.fillRect(-98,-322,196,22);if(lw){g.strokeStyle=L;g.lineWidth=lw;g.strokeRect(-98,-322,196,22);}
  g.strokeStyle=st.sash||'#fff';g.lineWidth=7;g.beginPath();g.moveTo(-100,-465);g.lineTo(90,-320);g.stroke();
  // left arm on hip
  limb([[-115,-455],[-195,-370],[-100,-320]],44,sk,L,lw);
  // right arm + gada (armA lifts it)
  g.save();g.translate(115,-455);g.rotate(-armA);
  limb([[0,0],[85,70],[45,-55]],44,sk,L,lw);
  g.save();g.translate(45,-55);g.rotate(.45);
  g.fillStyle=ga;g.fillRect(-9,-260,18,300);if(lw){g.strokeStyle=L;g.lineWidth=lw;g.strokeRect(-9,-260,18,300);}
  g.beginPath();g.arc(0,-310,64,0,7);g.fillStyle=ga;g.fill();if(lw){g.stroke();}
  if(st.gadaLine){g.strokeStyle=st.gadaLine;g.lineWidth=5;for(let i=-2;i<=2;i++){g.beginPath();g.ellipse(0,-310,Math.abs(64*Math.cos(i*.6)),64,0,0,7);g.stroke();}}
  g.beginPath();g.moveTo(-14,-372);g.lineTo(0,-410);g.lineTo(14,-372);g.fill();
  g.restore();g.restore();
  // necklace
  g.strokeStyle=cr;g.lineWidth=9;g.beginPath();g.arc(0,-480,58,.15*Math.PI,.85*Math.PI);g.stroke();
  // head
  g.beginPath();g.arc(0,-545,64,0,7);g.fillStyle=sk;g.fill();if(lw){g.strokeStyle=L;g.lineWidth=lw;g.stroke();}
  g.beginPath();g.ellipse(0,-515,46,30,0,0,7);g.fillStyle=st.muzzle||sk;g.fill();if(lw)g.stroke();
  g.fillStyle=st.eye||'#111';g.beginPath();g.ellipse(-24,-560,9,st.eyeGlow?12:9,0,0,7);g.ellipse(24,-560,9,st.eyeGlow?12:9,0,0,7);g.fill();
  if(st.eyeGlow){g.save();g.shadowColor='#fff6b0';g.shadowBlur=30;g.fillStyle='#fffbe0';g.beginPath();g.arc(-24,-560,7,0,7);g.arc(24,-560,7,0,7);g.fill();g.restore();}
  // moustache (handlebar)
  g.strokeStyle=st.moustache||'#111';g.lineWidth=9;g.lineCap='round';g.beginPath();g.moveTo(0,-522);g.quadraticCurveTo(-30,-532,-48,-515);g.quadraticCurveTo(-58,-500,-46,-500);
  g.moveTo(0,-522);g.quadraticCurveTo(30,-532,48,-515);g.quadraticCurveTo(58,-500,46,-500);g.stroke();
  g.fillStyle=st.tilak||'#d62020';g.beginPath();g.moveTo(-7,-575);g.lineTo(7,-575);g.lineTo(0,-605);g.fill();
  // crown
  poly([[-58,-595],[58,-595],[48,-640],[30,-628],[0,-700],[-30,-628],[-48,-640]],cr,L,lw||3);
  g.fillStyle=st.gem||'#d62020';g.beginPath();g.arc(0,-630,10,0,7);g.fill();
  g.restore();}

// ---------- helpers ----------
function paperTex(col,alpha=.06){g.save();g.globalAlpha=alpha;for(let i=0;i<500;i++){g.fillStyle=i%2?'#000':'#fff';g.fillRect(rnd()*W,rnd()*H,rnd()*3+1,rnd()*3+1);}g.restore();}
function grainFixed(){}
function temple(x,b,s,fill,line,lw){g.save();g.translate(x,b);g.scale(s,s);
  const D=(cx,w,h)=>{poly([[cx-w/2,0],[cx+w/2,0],[cx+w/2,-h],[cx-w/2,-h]],fill,line,lw);g.beginPath();g.moveTo(cx-w/2+5,-h);g.bezierCurveTo(cx-w/2,-h-w*.6,cx-w*.05,-h-w*.6,cx,-h-w*.85);g.bezierCurveTo(cx+w*.05,-h-w*.6,cx+w/2,-h-w*.6,cx+w/2-5,-h);g.closePath();g.fillStyle=fill;g.fill();if(lw){g.strokeStyle=line;g.lineWidth=lw;g.stroke();}
    g.strokeStyle=line;g.lineWidth=Math.max(lw,3);g.beginPath();g.moveTo(cx,-h-w*.85);g.lineTo(cx,-h-w*1.05);g.stroke();g.fillStyle='#e8541e';g.beginPath();g.moveTo(cx,-h-w*1.05);g.lineTo(cx+w*.3,-h-w*.97);g.lineTo(cx,-h-w*.9);g.fill();};
  D(-230,130,160);D(230,130,160);D(0,220,240);
  poly([[-330,0],[330,0],[330,-90],[-330,-90]],fill,line,lw);
  for(let i=-2;i<=2;i++){g.fillStyle=line;g.beginPath();g.moveTo(i*120-22,0);g.lineTo(i*120-22,-45);g.arc(i*120,-45,22,Math.PI,0);g.lineTo(i*120+22,0);g.fill();}
  g.restore();}
function saint(x,y,s,col,staff=true,arm=0){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=col;g.strokeStyle=col;
  g.beginPath();g.arc(0,-330,40,0,7);g.fill();
  g.beginPath();g.moveTo(-40,-290);g.quadraticCurveTo(-90,-150,-80,0);g.lineTo(80,0);g.quadraticCurveTo(90,-150,40,-290);g.closePath();g.fill();
  if(staff){g.lineWidth=10;g.lineCap='round';g.save();g.translate(50,-230);g.rotate(arm);g.beginPath();g.moveTo(0,0);g.lineTo(60,10);g.stroke();g.beginPath();g.moveTo(60,-90);g.lineTo(60,240);g.stroke();g.restore();}
  g.restore();}
function stick(x,y,s,ang,col){g.save();g.translate(x,y);g.rotate(ang);g.scale(s,s);g.fillStyle=col;g.beginPath();g.roundRect(-10,-300,20,600,10);g.fill();g.beginPath();g.arc(0,-310,22,0,7);g.fill();g.restore();}

// ================= SCENES =================
const S=[];
// 1 MADHUBANI
S.push({f(u,d){g.fillStyle='#f6e7c1';g.fillRect(0,0,W,H);
  // border
  const bw=60;g.fillStyle='#c0262d';g.fillRect(0,0,W,bw);g.fillRect(0,H-bw,W,bw);g.fillRect(0,0,bw,H);g.fillRect(W-bw,0,bw,H);
  g.fillStyle='#f2b51d';for(let i=0;i<W;i+=40){g.beginPath();g.moveTo(i,bw);g.lineTo(i+20,bw+26);g.lineTo(i+40,bw);g.fill();g.beginPath();g.moveTo(i,H-bw);g.lineTo(i+20,H-bw-26);g.lineTo(i+40,H-bw);g.fill();}
  for(let j=bw;j<H-bw;j+=40){g.beginPath();g.moveTo(bw,j);g.lineTo(bw+26,j+20);g.lineTo(bw,j+40);g.fill();g.beginPath();g.moveTo(W-bw,j);g.lineTo(W-bw-26,j+20);g.lineTo(W-bw,j+40);g.fill();}
  g.strokeStyle='#111';g.lineWidth=5;g.strokeRect(bw+30,bw+30,W-2*bw-60,H-2*bw-60);g.strokeRect(bw+42,bw+42,W-2*bw-84,H-2*bw-84);
  // sun with face
  g.save();g.translate(200,600);g.rotate(u*.3);for(let i=0;i<16;i++){g.rotate(Math.PI/8);g.fillStyle=i%2?'#c0262d':'#f2b51d';g.beginPath();g.moveTo(-14,70);g.lineTo(0,120);g.lineTo(14,70);g.fill();}g.restore();
  g.fillStyle='#f2b51d';g.beginPath();g.arc(200,600,70,0,7);g.fill();g.strokeStyle='#111';g.lineWidth=5;g.stroke();
  g.fillStyle='#111';g.beginPath();g.arc(180,590,7,0,7);g.arc(220,590,7,0,7);g.fill();g.beginPath();g.arc(200,615,18,.1*Math.PI,.9*Math.PI);g.stroke();
  // fish pair bottom + flowers
  for(const [fx,fl] of [[260,1],[820,-1]]){g.save();g.translate(fx,1640);g.scale(fl,1);g.fillStyle='#2a6fb5';g.beginPath();g.ellipse(0,0,110,45,0,0,7);g.fill();g.stroke();g.beginPath();g.moveTo(100,0);g.lineTo(160,-40);g.lineTo(160,40);g.closePath();g.fill();g.stroke();
    g.fillStyle='#111';g.beginPath();g.arc(-60,-8,8,0,7);g.fill();g.strokeStyle='#111';g.lineWidth=3;for(let i=-30;i<80;i+=22){g.beginPath();g.arc(i,0,18,-Math.PI/2,Math.PI/2);g.stroke();}g.restore();}
  for(let i=0;i<6;i++){const fx=180+i*145,fy=1480+(i%2)*40;g.fillStyle=['#c0262d','#2e8b57','#f2b51d'][i%3];for(let k=0;k<6;k++){g.beginPath();g.ellipse(fx+Math.cos(k)*22,fy+Math.sin(k)*22,16,9,k,0,7);g.fill();}g.fillStyle='#111';g.beginPath();g.arc(fx,fy,8,0,7);g.fill();}
  const pop=eo(pr(u,.2,.8));
  hanuman(560,1430,1.0*pop+.01,{skin:'#e8641e',cloth:'#c0262d',crown:'#f2b51d',gada:'#f2b51d',line:'#111',lw:6,muzzle:'#f6c38a',chest:'#111',sash:'#fff',
    dhotiDeco(){g.fillStyle='#111';for(let y=-300;y<-120;y+=24)for(let x=-150;x<150;x+=24){g.beginPath();g.arc(x+(y/24%2)*12,y,4,0,7);g.fill();}},gadaLine:'#111'},u,Math.sin(u*2)*.03);
  T('સાળંગપુરના હનુમાનજી',540,250,82,'#111',u,.3,99,{w:800});
  T('કષ્ટભંજન દેવ',540,380,130,'#c0262d',u,4.3,99,{stroke:'#f6e7c1',sw:10,pop:1});
  T('છેલ્લે સુધી જોજો!',540,1760,62,'#111',u,5.8,99,{w:700});
  styleTag('Madhubani',u);}});
// 2 MINIATURE
S.push({f(u,d){g.fillStyle='#b2242a';g.fillRect(0,0,W,H);g.fillStyle='#e7b43f';g.fillRect(36,36,W-72,H-72);g.fillStyle='#b2242a';g.fillRect(48,48,W-96,H-96);
  for(let i=70;i<W-60;i+=46){g.fillStyle='#e7b43f';g.beginPath();g.arc(i,66,6,0,7);g.arc(i,H-66,6,0,7);g.fill();}for(let j=70;j<H-60;j+=46){g.beginPath();g.arc(66,j,6,0,7);g.arc(W-66,j,6,0,7);g.fill();}
  g.save();g.beginPath();g.rect(90,90,W-180,H-180);g.clip();
  g.fillStyle='#24418f';g.fillRect(0,0,W,620);
  g.strokeStyle='#e9e2c8';g.lineWidth=4;for(const [cx,cy] of [[250,200],[700,170],[480,330],[850,380]]){for(let k=0;k<3;k++){g.beginPath();g.arc(cx+k*34-34,cy,17,Math.PI,0);g.stroke();}g.beginPath();g.moveTo(cx-70,cy+4);g.lineTo(cx+70,cy+4);g.stroke();}
  g.fillStyle='#efe6cc';g.beginPath();g.moveTo(0,620);for(let x=0;x<=W;x+=60)g.quadraticCurveTo(x+30,560,x+60,620);g.lineTo(W,1400);g.lineTo(0,1400);g.fill();
  // sun
  g.fillStyle='#e7b43f';g.beginPath();g.arc(260,760,70,0,7);g.fill();g.fillStyle='#e05a2a';g.beginPath();g.arc(260,760,52,0,7);g.fill();
  // temple
  temple(540,1260,1.1,'#fbf6ea','#8a6a2f',3);
  // hills
  for(const [hy,col] of [[1330,'#a9bf7f'],[1440,'#8eaa62'],[1560,'#6e8f4a']]){g.fillStyle=col;g.beginPath();g.moveTo(0,H);g.lineTo(0,hy);for(let x=0;x<=W;x+=270)g.quadraticCurveTo(x+135,hy-90,x+270,hy);g.lineTo(W,H);g.fill();}
  for(let i=0;i<14;i++){const tx=130+((i*173)%820),ty=1380+((i*97)%380);g.fillStyle='#3f6b33';g.fillRect(tx-4,ty,8,30);g.beginPath();g.arc(tx,ty,28,0,7);g.fill();g.fillStyle='#cfe0a0';for(let k=0;k<6;k++){g.beginPath();g.arc(tx+Math.cos(k*1.1)*14,ty+Math.sin(k*1.1)*14,3,0,7);g.fill();}}
  // devotees walking
  for(let i=0;i<5;i++){const px=((u*40+i*200)%1100)-60;g.fillStyle=['#e05a2a','#24418f','#e7b43f'][i%3];g.beginPath();g.arc(px,1280,14,0,7);g.fill();g.beginPath();g.moveTo(px-18,1340);g.lineTo(px,1295);g.lineTo(px+18,1340);g.fill();}
  g.restore();
  T('કષ્ટભંજન એટલે...',540,300,84,'#efe6cc',u,.2,99,{w:800});
  T('દુઃખોનો નાશ કરનાર',540,440,104,'#e7b43f',u,1.4,99,{stroke:'#5a1414',sw:12,pop:1});
  styleTag('Miniature Painting',u);}});
// 3 INK WASH
S.push({f(u,d){g.fillStyle='#f1ece0';g.fillRect(0,0,W,H);
  const mt=(y,amp,a,blur,off)=>{g.save();g.filter=`blur(${blur}px)`;g.fillStyle=`rgba(30,30,30,${a})`;g.beginPath();g.moveTo(0,H);g.lineTo(0,y);
    for(let x=0;x<=W;x+=20)g.lineTo(x,y-Math.abs(Math.sin(x/170+off))*amp-Math.sin(x/53+off)*amp*.2);g.lineTo(W,H);g.fill();g.restore();};
  const dr=u*6;g.save();g.translate(-dr,0);mt(900,260,.12,10,1);mt(1100,200,.2,6,3);g.restore();g.save();g.translate(-dr*2,0);mt(1300,160,.35,3,5);g.restore();
  g.save();g.filter='blur(14px)';g.fillStyle='rgba(241,236,224,.8)';g.fillRect(0,1150,W,120);g.restore();
  // ground stroke
  g.fillStyle='rgba(20,20,20,.75)';g.beginPath();g.moveTo(0,1560);g.quadraticCurveTo(540,1500,W,1570);g.lineTo(W,1600);g.quadraticCurveTo(540,1540,0,1600);g.fill();
  // walking saint in ink
  const wx=200+u*70;saint(wx,1545,1.2,'rgba(15,15,15,.92)',true,Math.sin(u*3)*.05);
  // red seal
  g.fillStyle='#b8241c';g.fillRect(880,1640,110,110);g.fillStyle='#f1ece0';g.font='800 46px Baloo';g.textAlign='center';g.textBaseline='middle';g.fillText('સાળં',935,1670);g.fillText('ગપુર',935,1718);
  T('લગભગ ૧૭૫ વર્ષ પહેલાં',540,320,84,'#1a1a1a',u,.2,99,{w:700});
  T('ગોપાળાનંદ સ્વામી',540,460,110,'#1a1a1a',u,2.0,99,{});
  T('અહીં સાળંગપુર આવ્યા',540,590,78,'#555',u,3.3,99,{w:700});
  styleTag('Ink Wash',u);}});
// 4 BLUEPRINT
S.push({f(u,d){g.fillStyle='#14467e';g.fillRect(0,0,W,H);g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1;for(let i=0;i<W;i+=30){g.beginPath();g.moveTo(i,0);g.lineTo(i,H);g.stroke();}for(let j=0;j<H;j+=30){g.beginPath();g.moveTo(0,j);g.lineTo(W,j);g.stroke();}
  g.strokeStyle='rgba(255,255,255,.2)';for(let i=0;i<W;i+=150){g.beginPath();g.moveTo(i,0);g.lineTo(i,H);g.stroke();}for(let j=0;j<H;j+=150){g.beginPath();g.moveTo(0,j);g.lineTo(W,j);g.stroke();}
  // draw-on line hanuman via dash
  const p=ease(pr(u,.2,d*.75));const scanY=1520-p*1050;g.save();g.beginPath();g.rect(0,scanY,W,H);g.clip();
  hanuman(540,1480,1.15,{skin:'#14467e',cloth:'#14467e',crown:'#14467e',gada:'#14467e',line:'#e8f2ff',lw:4,muzzle:'#14467e',eye:'#e8f2ff',moustache:'#e8f2ff',tilak:'#e8f2ff',gem:'#e8f2ff',sash:'rgba(232,242,255,.6)',gadaLine:'rgba(232,242,255,.5)'},u);
  g.restore();if(p<1){g.save();g.shadowColor='#9fd0ff';g.shadowBlur=20;g.fillStyle='#bfe2ff';g.fillRect(150,scanY-2,780,4);g.restore();}
  // dimension lines
  const da=pr(u,1.2,.8);g.save();g.globalAlpha=da;g.strokeStyle='#9fd0ff';g.fillStyle='#9fd0ff';g.lineWidth=3;
