<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000}
@font-face{font-family:Rozha;src:url(fonts/fontsource-rozha-one-5.3.0/package/files/rozha-one-devanagari-400-normal.woff2)}
@font-face{font-family:Tiro;src:url(fonts/fontsource-tiro-devanagari-hindi-5.3.0/package/files/tiro-devanagari-hindi-devanagari-400-normal.woff2)}
@font-face{font-family:TiroI;src:url(fonts/fontsource-tiro-devanagari-hindi-5.3.0/package/files/tiro-devanagari-hindi-devanagari-400-italic.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/fontsource-inter-5.3.0/package/files/inter-latin-700-normal.woff2)}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1920;
const cl=v=>Math.max(0,Math.min(1,v)),eo=v=>1-Math.pow(1-cl(v),3),eio=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
const back=v=>{v=cl(v);const s=1.7;return 1+(s+1)*Math.pow(v-1,3)+s*Math.pow(v-1,2)};const lerp=(a,b,t)=>a+(b-a)*t;
let sd=11;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
// paper + grain
const paper=document.createElement('canvas');paper.width=W;paper.height=H;{const g=paper.getContext('2d');g.fillStyle='#EFE8DA';g.fillRect(0,0,W,H);
 for(let i=0;i<1600;i++){const r=20+rnd()*120,X=rnd()*W,Y=rnd()*H,gr=g.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,rnd()>.5?'rgba(255,252,240,0.035)':'rgba(150,120,80,0.025)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(X-r,Y-r,2*r,2*r)}
 for(let i=0;i<60000;i++){g.fillStyle=`rgba(60,45,30,${rnd()*0.07})`;g.fillRect(rnd()*W,rnd()*H,1.4,1.4)}
 g.strokeStyle='rgba(120,110,95,0.07)';g.lineWidth=1;for(let i=0;i<W;i+=36){g.beginPath();g.moveTo(i,0);g.lineTo(i,H);g.stroke()}for(let i=0;i<H;i+=36){g.beginPath();g.moveTo(0,i);g.lineTo(W,i);g.stroke()}}
// hatch pattern for engraving
const hat=document.createElement('canvas');hat.width=hat.height=64;{const g=hat.getContext('2d');g.strokeStyle='rgba(50,30,15,0.55)';g.lineWidth=1.3;for(let i=0;i<64;i+=5){g.beginPath();g.moveTo(0,i);g.lineTo(64,i+2);g.stroke()}}
const HP=x.createPattern(hat,'repeat');
// ---- geometry (world coords) ----
const AX=150,Y0=1650,PPM=11.875,ym=m=>Y0-m*PPM,CX=560;
const tiers=[];{let y=1525;const n=13;for(let i=0;i<n;i++){const w=430*(1-i/15.5),h=(1525-1005)/n;tiers.push({x:CX-w/2,y:y-h,w,h});y-=h}}
function templePolys(){const P=[];P.push([[CX-270,Y0],[CX+270,Y0],[CX+270,1525],[CX-270,1525]]);
 for(const t of tiers){const o=8;P.push([[t.x,t.y+t.h],[t.x+t.w,t.y+t.h],[t.x+t.w-o,t.y],[t.x+o,t.y]])}
 const nk=[[CX-70,1005],[CX+70,1005],[CX+55,975],[CX-55,975]];P.push(nk);return P}
const POLYS=templePolys();
function domePath(){x.beginPath();x.moveTo(CX-95,975);x.bezierCurveTo(CX-110,925,CX-60,895,CX,893);x.bezierCurveTo(CX+60,895,CX+110,925,CX+95,975);x.closePath()}
function finialPath(){x.beginPath();x.moveTo(CX-10,895);x.quadraticCurveTo(CX-14,880,CX,866);x.quadraticCurveTo(CX+14,880,CX+10,895);x.closePath()}
function outline(){x.beginPath();x.moveTo(CX-270,Y0);x.lineTo(CX+270,Y0);x.lineTo(CX+270,1525);for(let i=0;i<tiers.length;i++){const t=tiers[i];x.lineTo(t.x+t.w,t.y+t.h);x.lineTo(t.x+t.w-8,t.y)}x.lineTo(CX+70,1005);x.lineTo(CX+95,975);x.bezierCurveTo(CX+110,925,CX+60,895,CX+10,895);x.quadraticCurveTo(CX+14,880,CX,866);x.quadraticCurveTo(CX-14,880,CX-10,895);x.bezierCurveTo(CX-60,895,CX-110,925,CX-95,975);x.lineTo(CX-70,1005);for(let i=tiers.length-1;i>=0;i--){const t=tiers[i];x.lineTo(t.x+8,t.y);x.lineTo(t.x,t.y+t.h)}x.lineTo(CX-270,1525);x.closePath()}
function poly(p){x.beginPath();x.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);x.closePath()}
// sketch phase
function sketch(p){x.save();x.strokeStyle='rgba(40,35,30,0.85)';x.lineWidth=2.2;x.lineCap='round';const L=7000;x.setLineDash([L,L]);x.lineDashOffset=L*(1-cl(p));outline();x.stroke();x.setLineDash([]);
 const q=cl((p-0.35)/0.65);x.globalAlpha=0.6*q;x.lineWidth=1.3;POLYS.forEach((pp,i)=>{if(i/POLYS.length>q)return;poly(pp);x.stroke();
  const [a,b,cc,d]=pp;const n=Math.max(2,Math.floor((b[0]-a[0])/34));for(let k=1;k<n;k++){const X=lerp(a[0],b[0],k/n),Y1=a[1]-3,Y2=d[1]+4;x.beginPath();x.moveTo(X,Y1);x.lineTo(X+1,Y2);x.stroke()}});
 x.globalAlpha=0.6*q;domePath();x.stroke();finialPath();x.stroke();x.restore()}
// real phase
function real(){x.save();x.shadowColor='rgba(40,25,10,0.35)';x.shadowBlur=26;x.shadowOffsetY=14;outline();x.lineJoin='round';x.lineWidth=22;x.strokeStyle='#FBF8F1';x.stroke();x.shadowColor='transparent';x.fillStyle='#FBF8F1';x.fill();x.restore();
 x.save();outline();x.clip();const g=x.createLinearGradient(CX-270,0,CX+270,0);g.addColorStop(0,'#7c5631');g.addColorStop(.35,'#caa36a');g.addColorStop(.6,'#b48852');g.addColorStop(1,'#5e3e20');x.fillStyle=g;x.fillRect(CX-300,850,600,820);
 x.globalCompositeOperation='multiply';x.fillStyle=HP;x.globalAlpha=0.55;x.fillRect(CX-300,850,600,820);x.globalAlpha=1;x.globalCompositeOperation='source-over';
 POLYS.forEach(pp=>{const [a,b,cc,d]=pp;x.fillStyle='rgba(255,235,195,0.35)';x.fillRect(d[0],d[1],cc[0]-d[0],3);x.fillStyle='rgba(30,15,5,0.45)';x.fillRect(a[0],a[1]-4,b[0]-a[0],4);
  const n=Math.max(2,Math.floor((b[0]-a[0])/34)),hh=a[1]-d[1];for(let k=0;k<n;k++){const X=lerp(a[0],b[0],(k+0.5)/n);x.fillStyle='rgba(35,18,6,0.55)';x.beginPath();x.moveTo(X-7,a[1]-6);x.lineTo(X-7,d[1]+hh*0.45);x.quadraticCurveTo(X,d[1]+hh*0.15,X+7,d[1]+hh*0.45);x.lineTo(X+7,a[1]-6);x.fill()}});
 const dg=x.createRadialGradient(CX-30,920,5,CX,940,110);dg.addColorStop(0,'#e3c38c');dg.addColorStop(1,'#6b4825');x.fillStyle=dg;domePath();x.fill();x.globalCompositeOperation='multiply';x.fillStyle=HP;x.globalAlpha=0.4;domePath();x.fill();x.globalAlpha=1;x.globalCompositeOperation='source-over';
 x.fillStyle='#d9a441';finialPath();x.fill();x.restore();
 x.save();x.strokeStyle='rgba(30,18,8,0.7)';x.lineWidth=1.5;outline();x.stroke();x.restore()}
// labels & pills
function label(s,X,Y,rot,p,fs=46,font='TiroI'){if(p<=0)return;const sc=back(p);x.save();x.translate(X,Y);x.rotate(rot);x.scale(sc,sc);x.font=`${fs}px ${font}`;const w=x.measureText(s).width+44,h=fs*1.55;
 x.shadowColor='rgba(40,25,10,0.28)';x.shadowBlur=14;x.shadowOffsetY=6;x.fillStyle='#F8F4EA';x.fillRect(-w/2,-h/2,w,h);x.shadowColor='transparent';x.fillStyle='rgba(120,100,70,0.08)';x.fillRect(-w/2,h/2-6,w,6);
 x.fillStyle='#2a2420';x.textAlign='center';x.textBaseline='middle';x.fillText(s,0,4);x.restore()}
function pill(s,X,Y,p,col='#2a2420',bg='rgba(250,246,238,0.95)'){if(p<=0)return;const sc=back(p);x.save();x.translate(X,Y);x.scale(sc,sc);x.font='34px Tiro';const w=x.measureText(s).width+36,h=50;
 x.shadowColor='rgba(40,25,10,0.22)';x.shadowBlur=10;x.shadowOffsetY=4;x.fillStyle=bg;x.beginPath();x.roundRect(-w/2,-h/2,w,h,25);x.fill();x.shadowColor='transparent';x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';x.fillText(s,0,3);x.restore()}
function axis(p){if(p<=0)return;x.save();x.strokeStyle='rgba(42,36,32,0.8)';x.lineWidth=2.5;x.beginPath();x.moveTo(AX,Y0);x.lineTo(AX,lerp(Y0,ym(84),eo(p)));x.stroke();
 x.font='30px Tiro';x.fillStyle='rgba(42,36,32,0.8)';x.textAlign='left';for(let m=0;m<=80;m+=10){const y=ym(m);if(y<lerp(Y0,ym(84),eo(p)))continue;const big=m%20===0;x.beginPath();x.moveTo(AX,y);x.lineTo(AX+(big?26:14),y);x.stroke();if(big&&m>0)x.fillText(m+(m===80?' मी':''),AX+34,y+10)}
 x.beginPath();x.moveTo(AX-20,Y0);x.lineTo(lerp(AX,1000,eo(p)),Y0);x.stroke();x.restore()}
function dashed(m,p,X0,X1){if(p<=0)return;x.save();x.strokeStyle='rgba(42,36,32,0.75)';x.lineWidth=2;x.setLineDash([12,9]);x.beginPath();x.moveTo(X0,ym(m));x.lineTo(lerp(X0,X1,eo(p)),ym(m));x.stroke();x.restore()}
function human(p){if(p<=0)return;x.save();x.globalAlpha=cl(p*2);const X=880,Y=Y0;x.fillStyle='#2a2420';x.beginPath();x.arc(X,Y-18,3.2,0,7);x.fill();x.fillRect(X-2.5,Y-14,5,9);x.fillRect(X-2.5,Y-6,2,6);x.fillRect(X+.5,Y-6,2,6);
 x.strokeStyle='rgba(42,36,32,0.6)';x.lineWidth=1.5;x.beginPath();x.moveTo(X,Y-26);x.lineTo(X,Y-120);x.stroke();x.restore();pill('इंसान 1.7 मी',X,Y-150,p)}
function circleMark(p){if(p<=0)return;x.save();x.strokeStyle='#C8372D';x.lineWidth=6;x.lineCap='round';x.beginPath();const N=60;for(let i=0;i<=N*cl(p);i++){const a=-1.2+i/N*6.6,r=125+Math.sin(i*0.4)*4+i*0.25;const X=CX+Math.cos(a)*r*1.05,Y=930+Math.sin(a)*r*0.72;i?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke();x.restore()}
function elephant(X,Y,s,p,t){if(p<=0)return;x.save();x.globalAlpha=cl(p*2);x.translate(X,Y);x.scale(s,s);x.rotate(-0.42);
 const body=()=>{x.beginPath();x.ellipse(0,-60,70,46,0,0,7);x.moveTo(-60,-70);x.ellipse(-78,-78,32,34,0,0,7);};
 x.shadowColor='rgba(40,25,10,0.3)';x.shadowBlur=10;x.shadowOffsetY=5;x.fillStyle='#FBF8F1';x.strokeStyle='#FBF8F1';x.lineWidth=14;body();x.stroke();x.fill();x.shadowColor='transparent';
 x.fillStyle='#6f6a63';body();x.fill();const st=Math.sin(t*9)*6;x.fillRect(-48+st,-25,18,40);x.fillRect(-18-st,-25,18,40);x.fillRect(22+st,-25,18,40);x.fillRect(48-st,-25,16,40);
 x.lineWidth=12;x.strokeStyle='#6f6a63';x.lineCap='round';x.beginPath();x.moveTo(-100,-70);x.quadraticCurveTo(-125,-30,-112,10);x.stroke();x.fillStyle='rgba(30,25,20,0.35)';x.beginPath();x.ellipse(-62,-80,16,22,0.2,0,7);x.fill();
 x.globalCompositeOperation='multiply';x.fillStyle=HP;x.globalAlpha=0.5;body();x.fill();x.restore()}
// ---- render ----
window.render=function(t){x.setTransform(1,0,0,1,0,0);x.drawImage(paper,0,0);
 // camera: start close on headline, pull out, then push to capstone
 const pull=eio((t-2.3)/1.6),push=eio((t-7.2)/2.2);
 const s=lerp(lerp(1.45,1.0,pull),1.3,push),fx=lerp(lerp(540,540,pull),CX,push),fy=lerp(lerp(470,960,pull),960,push);
 x.setTransform(s,0,0,s,W/2-fx*s,H/2-fy*s+lerp(0,90,push)*s);
 // headline
 label('ये था एक',760,300,0.03,(t-0.2)/0.35);
 const hp=eo((t-0.55)/0.7);if(hp>0){x.save();x.beginPath();x.rect(80,300,940*hp,330);x.clip();x.font='300px Rozha';x.textAlign='center';x.fillStyle='#1F3A85';x.shadowColor='rgba(20,30,60,0.18)';x.shadowBlur=6;x.shadowOffsetY=4;x.fillText('रहस्य',540,560);x.restore()}
 label('80 टन का',720,600,-0.025,(t-1.45)/0.35);
 // chart
 axis((t-2.6)/1.0);dashed(66,(t-3.2)/0.9,AX,960);
 const sk=cl((t-3.0)/1.7),rl=cl((t-4.7)/1.1);
 if(rl<1)sketch(sk);
 if(rl>0){x.save();x.beginPath();const yy=lerp(Y0+30,840,eio(rl));x.rect(0,yy,W,H);x.clip();real();x.restore();
  if(rl<1){x.save();x.strokeStyle='rgba(255,250,235,0.9)';x.lineWidth=3;x.shadowColor='rgba(255,220,150,0.9)';x.shadowBlur=20;x.beginPath();const yy2=lerp(Y0+30,840,eio(rl));x.moveTo(CX-300,yy2);x.lineTo(CX+300,yy2);x.stroke();x.restore()}}
 pill('66 मीटर',890,ym(66)-34,(t-4.1)/0.35);
 pill('सन 1010',CX,Y0+52,(t-5.0)/0.35);
 human((t-5.6)/0.4);
 // ramp + elephant + capstone
 const rp=(t-6.3)/0.8;if(rp>0){x.save();x.strokeStyle='rgba(42,36,32,0.6)';x.lineWidth=2.5;x.setLineDash([14,10]);x.beginPath();x.moveTo(1000,1330);x.lineTo(lerp(1000,CX+120,eo(rp)),lerp(1330,960,eo(rp)));x.stroke();x.restore()}
 elephant(lerp(905,845,cl((t-6.6)/3)),lerp(1235,1150,cl((t-6.6)/3)),0.5,(t-6.6)/0.4,t);
 label('6.5 किमी लंबी ढलान?',790,1330,0.04,(t-6.9)/0.35,36);
 circleMark((t-7.6)/0.9);pill('80 टन का पत्थर',CX,800,(t-8.3)/0.35,'#FFFFFF','#C8372D');
 // vignette
 x.setTransform(1,0,0,1,0,0);const v=x.createRadialGradient(540,960,700,540,960,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(60,40,20,0.22)');x.fillStyle=v;x.fillRect(0,0,W,H)};
window.ready=Promise.all(['300px Rozha','46px TiroI','34px Tiro','700 20px Inter'].map(f=>document.fonts.load(f,'रहस्य 1')));
</script></body></html>
