/* ================= BHOOLE KISSE 3D + 2.5D TEMPLATE =================
   Per video, edit ONLY the block marked "TOPIC CONTENT": HEAD, SHOTS (one per script line).
   Each shot: {kind:'3d'|'2d', setup3d(), cam(lt,t), draw2d(lt,t)}.
   Rule: things enter ON the words that name them -> use at(line,'word') for every entrance.
   ================================================================== */
const TM=__TIMING__;
const c=document.getElementById('c'),x=c.getContext('2d');const W=1080,H=1920;

window.ready=Promise.all([document.fonts.load('800 40px Baloo2','अआ'),document.fonts.load('800 40px Baloo2','AB'),document.fonts.load('700 40px Pop','A'),new Promise(r=>{if(LOGO.complete)r();else LOGO.onload=r})]);
const cl=v=>Math.max(0,Math.min(1,v)),eo=v=>1-Math.pow(1-cl(v),3),eio=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
const back=v=>{v=cl(v);const s=1.9;return 1+(s+1)*Math.pow(v-1,3)+s*Math.pow(v-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
const GOLD='#FFB547',ORANGE='#FF7A2F',CREAM='#FFE9D0';
function rr(X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function txt(s,X,Y,font,fill,al='center',stroke=0,sc='#1a0508'){x.font=font;x.textAlign=al;x.textBaseline='alphabetic';if(stroke){x.lineJoin='round';x.lineWidth=stroke;x.strokeStyle=sc;x.strokeText(s,X,Y)}x.fillStyle=fill;x.fillText(s,X,Y)}
// time (absolute) of the n-th word in a line containing sub
function wt(line,sub,n=0){let k=0;for(const w of TM.words){if(w.line===line&&w.w.includes(sub)){if(k===n)return w.s;k++}}return TM.lines[line].s}
const NL=TM.lines.length;
function lineAt(t){let L=0;for(let i=0;i<NL;i++)if(t>=TM.lines[i].s-0.12)L=i;return L}
// local-time of a word inside current line (for shot code): at(L,'word')
function at(L,sub,n=0){return wt(L,sub,n)-TM.lines[L].s}
// card pop label (2.5D overlay)
function tag2(s,X,Y,p,bg=CREAM,fg='#2a0a0e',fs=46,rot=0){if(p<=0)return;x.save();x.translate(X,Y);x.rotate(rot);x.scale(p,p);x.font=`800 ${fs}px Baloo2`;const w=x.measureText(s).width+48;x.fillStyle='rgba(0,0,0,0.35)';rr(-w/2+8,-fs*0.85+10,w,fs*1.5,fs*0.75);x.fill();rr(-w/2,-fs*0.85,w,fs*1.5,fs*0.75);x.fillStyle=bg;x.fill();txt(s,0,fs*0.33,`800 ${fs}px Baloo2`,fg);x.restore()}
function stamp(X,Y,s,rot,label,col='#e0262e'){x.save();x.translate(X,Y);x.rotate(rot);x.scale(s,s);x.font='800 92px Baloo2';const hw=Math.max(150,x.measureText(label).width/2+40);x.strokeStyle=col;x.lineWidth=10;rr(-hw,-70,hw*2,140,18);x.stroke();x.lineWidth=4;rr(-hw+14,-56,hw*2-28,112,12);x.stroke();txt(label,0,30,'800 92px Baloo2',col);x.restore()}
// 2.5D parallax helper: draw fn at depth d with camera push p / sway sx
let CAM2={p:0,x:0};function D(d,fn){x.save();const s=1+CAM2.p*1.6/d;x.translate(540+CAM2.x/d,960);x.scale(s,s);x.translate(-540,-960);fn();x.restore()}

// ================= THREE.JS SETUP =================

 const hs=new THREE.Shape();hs.moveTo(-1,0.35);hs.lineTo(1,0.35);hs.lineTo(0.65,0);hs.lineTo(-0.65,0);hs.closePath();

  const glow=new THREE.Mesh(new THREE.SphereGeometry(0.22,10,8),new THREE.MeshBasicMaterial({color:0xffa030,transparent:true,opacity:0.35}));glow.position.copy(f.position);g.add(glow)}
 return g}
function ship(hullCol=0x5a2a14,sailCol=0xf3e3c3){const g=new THREE.Group();
 const hs=new THREE.Shape();hs.moveTo(-3,1);hs.quadraticCurveTo(-2.6,0,-1.8,-0.2);hs.lineTo(1.8,-0.2);hs.quadraticCurveTo(2.6,0,3.2,1.2);hs.lineTo(-3,1);
 const hull=new THREE.Mesh(new THREE.ExtrudeGeometry(hs,{depth:1.4,bevelEnabled:true,bevelSize:0.08,bevelThickness:0.08,bevelSegments:1}),M(hullCol));hull.position.z=-0.7;g.add(hull);
 const mast=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,4.2,8),M(0x3a1a0a));mast.position.set(0,3,0);g.add(mast);
 const sg=new THREE.PlaneGeometry(2.6,2.6,8,8);const p=sg.attributes.position;for(let i=0;i<p.count;i++){const X=p.getX(i),Y=p.getY(i);p.setZ(i,0.5*Math.cos(X*0.6)*(1-Math.abs(Y)/2))}sg.computeVertexNormals();
 const sail=new THREE.Mesh(sg,M(sailCol,{side:THREE.DoubleSide}));sail.position.set(0,3.2,0.25);g.add(sail);
 const flag=new THREE.Mesh(new THREE.PlaneGeometry(0.6,0.35),M(0xffb547,{side:THREE.DoubleSide}));flag.position.set(0.3,5.2,0);g.add(flag);g.userData.sail=sail;return g}
function water(size=60,seg=70,col=0x1d5a7a){const geo=new THREE.PlaneGeometry(size,size,seg,seg);geo.rotateX(-Math.PI/2);const m=new THREE.Mesh(geo,M(col,{roughness:0.35,metalness:0.1}));m.userData.base=geo.attributes.position.array.slice();return m}
function waveUpdate(m,t,amp=0.25,k=0.35,sp=1.2){const p=m.geometry.attributes.position,b=m.userData.base;for(let i=0;i<p.count;i++){const X=b[i*3],Z=b[i*3+2];p.setY(i,Math.sin(X*k+t*sp)*amp+Math.cos(Z*k*1.3+t*sp*0.8)*amp*0.7)}p.needsUpdate=true;m.geometry.computeVertexNormals()}
function waveH(X,Z,t,amp=0.25,k=0.35,sp=1.2){return Math.sin(X*k+t*sp)*amp+Math.cos(Z*k*1.3+t*sp*0.8)*amp*0.7}
function land(pts,col=0x2f7d32,h=0.3){const s=new THREE.Shape();pts.forEach(([a,b],i)=>i?s.lineTo(a,b):s.moveTo(a,b));s.closePath();const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:true,bevelSize:0.12,bevelThickness:0.1,bevelSegments:2});g.rotateX(-Math.PI/2);return new THREE.Mesh(g,M(col))}
function blob(cx,cz,rx,rz,n=14,seed=1){const p=[];for(let i=0;i<n;i++){const a=i/n*6.283,r=1+0.18*Math.sin(a*3+seed)+0.1*Math.cos(a*5+seed*2);p.push([cx+Math.cos(a)*rx*r,-(cz+Math.sin(a)*rz*r)])}return p}

 const india=land([[-14,10],[-4,10],[-4.5,7],[-6,4.5],[-8,2.5],[-10,0.5],[-14,-1]],0xb5651d,0.5);india.name='india';G.map.add(india);

 for(let i=0;i<40;i++){const b=paperBoat([0x9ccc65,0xffe9d0,0xffb547][i%3],true);b.scale.setScalar(0.5+hash(i)*0.3);b.userData.i=i;G.dawn.add(b)}}

 {kind:'3d',grp:'boats',bg:0x1a0a20,fog:[20,70],
